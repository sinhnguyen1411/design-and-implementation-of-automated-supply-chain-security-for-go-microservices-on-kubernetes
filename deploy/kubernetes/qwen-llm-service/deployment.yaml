apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-llm-service
  namespace: stock-trading
  labels:
    app: qwen-llm-service
    layer: ai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-llm-service
  template:
    metadata:
      labels:
        app: qwen-llm-service
    spec:
      volumes:
        - name: model-data
          emptyDir: {}
      initContainers:
        - name: init-model-verifier
          image: bitnami/cosign:latest
          command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Starting Zero-Trust Model Verification..."
              
              # Tải tệp mô hình và chữ ký từ S3 nội bộ hoặc HuggingFace (Mô phỏng)
              echo "[1/3] Downloading Qwen2.5:3b model weights and signature..."
              # wget https://internal-s3.stock-trading.local/models/qwen2.5-3b.gguf -O /models/qwen2.5-3b.gguf
              # wget https://internal-s3.stock-trading.local/models/qwen2.5-3b.gguf.sig -O /models/qwen2.5-3b.gguf.sig
              
              # Thực thi Cosign xác minh Blob
              echo "[2/3] Verifying cryptographic signature of the model blob..."
              # cosign verify-blob --key /etc/cosign/cosign.pub --signature /models/qwen2.5-3b.gguf.sig /models/qwen2.5-3b.gguf
              
              # Giả lập thành công cho môi trường Demo
              echo "Cosign Verification: SUCCESS. Signature matches the trusted CI/CD key."
              echo "[3/3] Model is verified and ready for serving."
              
              # (Tạo một tệp cờ để Main Container biết đã verify xong)
              touch /models/verified.flag
          volumeMounts:
            - name: model-data
              mountPath: /models
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_MODELS
              value: "/models"
            - name: OLLAMA_KEEP_ALIVE
              value: "24h" # Tối ưu hóa tải model trong bộ nhớ cho HA
          volumeMounts:
            - name: model-data
              mountPath: /models
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 20
