apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qwen-llm-service-hpa
  namespace: stock-trading
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qwen-llm-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
